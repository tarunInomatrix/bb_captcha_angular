<div class="app-shell">
  <!-- Top Environment Navigation Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="logo-shield">🛡️</div>
        <div class="brand-text">
          <span class="brand-title">BotBuster Captcha</span>
          <span class="brand-badge">Angular Test Harness</span>
        </div>
      </div>

      <!-- Environment Switching Tabs -->
      <nav class="env-nav" aria-label="Environment switcher">
        <a routerLink="/prod" routerLinkActive="active-env-prod" class="env-tab prod-tab">
          <span class="tab-dot dot-prod"></span>
          <span class="tab-label">1. Prod Env</span>
          <span class="tab-tag tag-prod">PROD</span>
        </a>

        <a routerLink="/dev" routerLinkActive="active-env-dev" class="env-tab dev-tab">
          <span class="tab-dot dot-dev"></span>
          <span class="tab-label">2. Dev Env</span>
          <span class="tab-tag tag-dev">DEV</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Main View Area (Renders ProdEnvComponent or DevEnvComponent) -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
